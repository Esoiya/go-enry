name: Go Tests
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['**.go', 'go.mod', 'go.sum', 'internal/**', '_testdata/**', '.github/workflows/goTest.yml']
  pull_request:
    paths: ['**.go', 'go.mod', 'go.sum', 'internal/**', '_testdata/**', '.github/workflows/goTest.yml']

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, go: '1.25.x'}
          - {os: ubuntu-latest, go: '1.26.x'}
          - {os: macos-latest, go: '1.26.x'}
          - {os: windows-latest, go: '1.26.x'}
    steps:
      - name: Preserve LF in test fixtures
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...

  test-oniguruma:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
      - run: sudo apt-get update && sudo apt-get install -y libonig-dev
      - run: go test -tags oniguruma ./...
