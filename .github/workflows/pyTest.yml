name: Python Tests
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['**.go', 'go.mod', 'go.sum', 'python/**', '.github/**']
  pull_request:
    paths: ['**.go', 'go.mod', 'go.sum', 'python/**', '.github/**']

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # cibuildwheel covers supported CPython versions. This checks editable installs.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: python -m pip install -r python/requirements.dev.txt -e ./python
      - name: Test editable install and long memory regression
        env:
          ENRY_MEM_RUN_LONG: '1'
          ENRY_MEM_ITERS_LONG: '50000'
        run: python -m pytest python/tests -q
