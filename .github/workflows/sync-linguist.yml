name: Sync Linguist
on:
  workflow_dispatch:
    inputs:
      linguist_tag:
        description: 'Stable tag override (for example v9.5.0)'
        type: string
        default: ''
      dry_run:
        description: 'Validate generation without creating an update PR'
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
concurrency:
  group: sync-linguist
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.release.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check for a new stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          LINGUIST_TAG: ${{ inputs.linguist_tag }}
        run: python3 .github/scripts/sync_linguist.py check
      - name: Generate update in an isolated container
        if: steps.release.outputs.changed == 'true' || inputs.dry_run
        env:
          LINGUIST_TAG: ${{ steps.release.outputs.tag }}
          LINGUIST_COMMIT: ${{ steps.release.outputs.commit }}
        run: bash .github/scripts/generate_linguist.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.release.outputs.changed == 'true' || inputs.dry_run
        with:
          name: linguist-patch
          path: linguist.patch
          retention-days: 1
          if-no-files-found: error

  pull-request:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # This job never executes generated code or scripts from the prepared artifact.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linguist-patch
          path: ${{ runner.temp }}/linguist-update
      - name: Apply only language data and version metadata
        run: >-
          git apply --include='data/*.go' --include='README.md'
          --include='internal/code-generator/generator/generator_test.go'
          --include='internal/code-generator/generator/test_files/*.gold'
          "$RUNNER_TEMP/linguist-update/linguist.patch"
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: feature/sync-linguist
          title: 'chore(data): update Linguist definitions'
          commit-message: |
            chore(data): update Linguist definitions

            - Regenerate language data from the latest selected stable release.
          body: 'Updates generated Linguist definitions and version metadata. Review the diff and approve any required CI runs before merging.'
          add-paths: |
            data/**/*.go
            README.md
            internal/code-generator/generator/generator_test.go
            internal/code-generator/generator/test_files/*.gold
