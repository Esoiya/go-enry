name: Build Python Wheels
on:
  workflow_dispatch:
  push:
    tags: ['python-v*']
    branches: [master]
    paths: ['**.go', '**.c', '**.h', 'go.mod', 'go.sum', 'python/**', 'Makefile', '.github/workflows/python-wheels.yml']
  pull_request:
    paths: ['**.go', '**.c', '**.h', 'go.mod', 'go.sum', 'python/**', 'Makefile', '.github/workflows/python-wheels.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  GO_VERSION: '1.26.x'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Stage Go toolchain for the manylinux container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p .ci
          cp -a "$(go env GOROOT)" .ci/go
      - name: Build and test wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: python
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: 'cp -a /project/.ci/go /opt/enry-go'
          CIBW_ENVIRONMENT_LINUX: 'PATH=/opt/enry-go/bin:$PATH'
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET=12.0'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  build_sdist:
    name: Build and test source distribution
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build sdist and rebuild wheel from it
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group python/pyproject.toml:ci
          python -m unittest discover -s python/packaging_tests -v
          python -m build python
          python -m twine check python/dist/*
      - name: Verify release artifact versions
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version
          expected = Version(os.environ['GITHUB_REF_NAME'].removeprefix('python-v'))
          for artifact in Path('python/dist').iterdir():
              parse = parse_wheel_filename if artifact.suffix == '.whl' else parse_sdist_filename
              assert parse(artifact.name)[1] == expected, f'Release version mismatch: {artifact.name}'
          PY
      - name: Test the wheel rebuilt from the sdist outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/enry-test"
          "$RUNNER_TEMP/enry-test/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/enry-test/bin/python" -m pip install --group python/pyproject.toml:test python/dist/*.whl
          cp -R python/tests "$RUNNER_TEMP/enry-tests"
          cd "$RUNNER_TEMP"
          enry-test/bin/python -m pytest enry-tests -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    timeout-minutes: 10
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-22.04
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/python-v')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
