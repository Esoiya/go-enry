[build-system]
# CFFI 2 supports Python 3.14; setuptools 77 supports SPDX license metadata.
requires = ["setuptools>=77.0.0", "cffi>=2.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enry"
version = "0.3.0"
description = "Python bindings for go-enry language detector"
readme = "README.md"
authors = [
    {name = "go-enry contributors"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cffi>=2.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/Esoiya/go-enry"
Repository = "https://github.com/Esoiya/go-enry"
Issues = "https://github.com/Esoiya/go-enry/issues"
Documentation = "https://github.com/Esoiya/go-enry/tree/master/python"

[tool.setuptools]
packages = ["enry"]
# Ensure the build script is included in the sdist so others can build it
include-package-data = true

# Native code is generated directly in build_lib, never copied from the checkout.
[tool.setuptools.exclude-package-data]
enry = ["*.so", "*.dylib", "*.dll", "*.h"]
